    <script>
      (function() {
        try {
          // Sync with Linko theme
          const stored = localStorage.getItem('linko_theme') || localStorage.getItem('linkpulse_theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
